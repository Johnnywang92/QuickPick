version: '3.8'

# ==============================================================================
# QuickPick Studio NAS 协同套件 Docker Compose 配置
# 适用平台：群晖 Synology Container Manager、威联通 QNAP Container Station、Unraid
# ==============================================================================

services:
  quickpick-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.nas
    image: quickpick-server:latest
    container_name: quickpick-server
    restart: unless-stopped
    environment:
      - PUID=1000             # 运行用户 UID (建议匹配 NAS 存储共享目录所属用户)
      - PGID=1000             # 运行组 GID
      - WATCH_DIRS=/photos    # 挂载的相册工作目录 (支持冒号/分号分隔多个目录)
      - QUICKPICK_CACHE_DIR=/cache
      - SCAN_INTERVAL=30      # 自动巡检新拷入 RAW 的时间间隔 (秒)
      - PROXY_MAX_EDGE=2048   # 2K 代理图像分辨率上限 (像素)
    volumes:
      # 原片卷永久只读；代理和索引写入独立缓存卷。
      - /volume1/photo:/photos:ro
      - quickpick-cache:/cache
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4096M
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  quickpick-cache:
