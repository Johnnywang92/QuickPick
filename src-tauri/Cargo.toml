[package]
name = "quickpick-engine"
version = "0.1.0"
description = "QuickPick High-Performance RAW Triage Engine"
authors = ["QuickPick Team"]
edition = "2021"

[lib]
name = "quickpick_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "quickpick-engine"
path = "src/main.rs"

[[bin]]
name = "quickpick-server"
path = "src/bin/server.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
pkg-config = "0.3"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
libc = "0.2"
base64 = "0.22"
quick-xml = "0.42"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
