[package]
name = "quickpick-engine"
version = "0.1.0"
description = "QuickPick High-Performance RAW Triage Engine"
authors = ["QuickPick Team"]
edition = "2021"

[lib]
name = "quickpick_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "quickpick-engine"
path = "src/main.rs"

[[bin]]
name = "quickpick-server"
path = "src/bin/server.rs"
required-features = ["server-bin"]

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"
required-features = ["benchmark-bin"]

[[bin]]
name = "real-media-acceptance"
path = "src/bin/real_media_acceptance.rs"
required-features = ["acceptance-bin"]

[features]
default = []
server-bin = []
benchmark-bin = []
acceptance-bin = []

[build-dependencies]
tauri-build = { version = "2", features = [] }
pkg-config = "0.3"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "pnm", "webp"] }
libc = "0.2"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["backup", "bundled"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSSharingService"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSString", "NSURL"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
