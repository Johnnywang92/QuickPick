name: QuickPick CI & Quality Gate

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  quality-gate:
    name: Engineering Quality Gate (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (LibRaw & LittleCMS2)
        run: |
          brew install libraw little-cms2 pkg-config

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Node dependencies
        run: npm install

      - name: Step 1 - Frontend Build & Typecheck
        run: npm run build

      - name: Step 2 - Backend Static Analysis (Clippy Zero-Warning)
        run: npm run clippy

      - name: Step 3 - Backend Unit & Integration Tests (27 Tests)
        run: npm run test:rs

      - name: Step 4 - Performance & Distribution Baselines
        run: npm run baseline
